version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mess_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mess_user
      POSTGRES_PASSWORD: mess_password
      POSTGRES_DB: smart_mess
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
