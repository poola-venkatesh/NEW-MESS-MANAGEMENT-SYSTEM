services:
  - type: web
    name: smart-mess-management
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smart-mess-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: BIOMETRIC_ENCRYPTION_KEY
        generateValue: true
      - key: HOSTEL_NAME
        value: "RGUKT Smart Mess Management System"
      - key: HOSTEL_TIMEZONE
        value: "Asia/Kolkata"
      - key: FACE_MATCH_THRESHOLD
        value: "0.50"

databases:
  - name: smart-mess-db
    plan: free
    region: oregon
    databaseName: smart_mess
    user: mess_admin
