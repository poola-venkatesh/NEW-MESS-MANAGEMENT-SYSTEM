services:
  - type: web
    name: smart-mess-management
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BIOMETRIC_ENCRYPTION_KEY
        generateValue: true
      - key: HOSTEL_NAME
        value: "RGUKT Smart Mess Management System"
      - key: HOSTEL_TIMEZONE
        value: "Asia/Kolkata"
      - key: FACE_MATCH_THRESHOLD
        value: "0.50"
      - key: ADMIN_INITIAL_USERNAME
        value: "admin"
      - key: ADMIN_INITIAL_PASSWORD
        value: "AdminMaster2026!"
      - key: FRONTEND_URL
        sync: false
